name: heroStats

# OpenDota's /api/heroStats, mirrored once a day for the Dota Forge app. The
# numbers barely move in a day; on patch day, run it by hand (Run workflow).
# 21:37 UTC, off the hour: GitHub delays scheduled runs by up to ~5 hours,
# which still lands before evening in Russia, where most players are.
on:
  schedule:
    - cron: '37 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Both workflows commit to main; never let them race.
concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch heroStats
        run: python3 scripts/fetch_hero_stats.py
        env:
          OPENDOTA_API_KEY: ${{ secrets.OPENDOTA_API_KEY }}
      - name: Commit if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/heroStats.json
          if git diff --cached --quiet; then
            echo 'No change'
            exit 0
          fi
          git commit -m "heroStats $(date -u +%Y-%m-%dT%H:%MZ)"
          # GitHub sometimes fires a schedule twice; if the other run already
          # pushed its copy, keep that one instead of failing.
          if ! git pull --rebase; then
            git rebase --abort
            echo 'Another run pushed first; keeping its copy'
            exit 0
          fi
          git push
      - name: Purge jsDelivr
        # The app falls back to jsDelivr when GitHub is blocked; without a
        # purge it serves the old file for up to 12 hours.
        run: curl -fsS https://purge.jsdelivr.net/gh/yulons/hero_stats@main/data/heroStats.json || echo 'Purge failed; jsDelivr catches up within 12 hours'
